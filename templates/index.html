<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Herencia - Uma Musume</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f1115; 
            color: #e0e0e0;
        }
        .contenedor {
            background-color: #181b20;
            padding: 35px;
            border-radius: 12px;
            border: 1px solid #2a2e37;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            max-width: 950px;
            margin: 40px auto;
        }
        label {
            font-weight: 600;
            color: #9ab;
            margin-bottom: 6px;
        }
        .form-select, .form-control {
            background-color: #111317 !important;
            color: #fff !important;
            border: 1px solid #333842;
            border-radius: 8px;
        }
        .form-select:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 0.2rem rgba(52, 152, 219, 0.25);
        }
        .btn-calculate {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            border: none;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
            transition: all 0.2s ease;
        }
        .btn-calculate:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(46, 204, 113, 0.4);
            background: linear-gradient(135deg, #2ecc71, #27ae60);
        }
        #seccion-resultados {
            display: none; 
        }
        /* Estilos de podio para las tarjetas */
        .card-top-1 {
            border: 2px solid #ffd700 !important;
            background: linear-gradient(145deg, #222014, #181b20) !important;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.15);
        }
        .card-top-2 {
            border: 1px solid #aebac1 !important;
            background: linear-gradient(145deg, #1c2024, #181b20) !important;
        }
        .card-top-3 {
            border: 1px solid #cd7f32 !important;
            background: linear-gradient(145deg, #241d18, #181b20) !important;
        }
        .card-normal {
            border: 1px solid #2a2e37 !important;
            background-color: #181b20 !important;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1 class="text-center mb-4 text-light fw-bold" style="letter-spacing: -0.5px;">
            <span style="color: #2ecc71;">uma</span>.herencia
        </h1>
        
        <form id="formulario-herencia">
            <div class="row g-3">
                <div class="col-md-12">
                    <label for="uma_id">Selecciona tu Umamusume:</label>
                    <select id="uma_id" name="uma_id" class="form-select" required>
                        <option value="">Cargando Umamusumes...</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="racetrack">Pista / Hipódromo:</label>
                    <select id="racetrack" class="form-select" required>
                        <option value="">Cargando pistas...</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="terrain">Superficie (Terreno):</label>
                    <select id="terrain" class="form-select" required>
                        <option value="">Cargando terrenos...</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="direction">Dirección:</label>
                    <select id="direction" class="form-select" required>
                        <option value="">Cargando directions...</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="length_type">Tipo de Distancia:</label>
                    <select id="length_type" class="form-select" required>
                        <option value="">Cargando tipos...</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="length">Distancia (metros):</label>
                    <select id="length" class="form-select" required>
                        <option value="">Cargando distancias...</option>
                    </select>
                </div>
                <div class="col-md-12">
                    <label for="estrategia">Estrategia a usar:</label>
                    <select id="estrategia" class="form-select" required>
                        <option value="Front Runner">Front Runner (Runner / Nige)</option>
                        <option value="Pace Chaser">Pace Chaser (Leader / Senkou)</option>
                        <option value="Late Surger">Late Surger (Betweener / Sashi)</option>
                        <option value="End Closer">End Closer (Chaser / Oikomi)</option>
                    </select>
                </div>
                <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-calculate text-light w-100 py-3 fs-5">Calcular Mejores Padres</button>
                </div>
            </div>
        </form>

        <div id="seccion-resultados" class="mt-5 pt-4 border-top" style="border-color: #2a2e37 !important;">
            <h3 class="mb-4 text-center fw-bold" style="color: #34e89e;">Mejores Compatibilidades</h3>
            <div id="contenedor-tarjetas" class="mb-5"></div>
            
            <h3 class="mt-5 mb-3 text-center fw-bold" style="color: #3498db;">Visualización del Grafo (Red Descentralizada)</h3>
            <p class="text-center text-muted small mb-3">Conexiones relacionales basadas en rasgos compartidos del Top 10</p>
            <div id="red-grafos" style="width: 100%; height: 600px; background-color: #111317; border: 1px solid #2a2e37; border-radius: 12px;" class="mb-4"></div>
        </div>
    </div>

    <script>
        let todasLasDistancias = []; // Para almacenar las distancias originales del CSV

        // 1. CARGA INICIAL DE DATOS
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const respuesta = await fetch('/api/opciones_carrera');
                const datos = await respuesta.json();

                const llenarMenu = (idElemento, opciones) => {
                    const select = document.getElementById(idElemento);
                    select.innerHTML = ''; 
                    opciones.forEach(opcion => {
                        const opt = document.createElement('option');
                        opt.value = opcion;
                        opt.textContent = opcion;
                        select.appendChild(opt);
                    });
                };

                const selectUma = document.getElementById('uma_id');
                selectUma.innerHTML = '<option value="">-- Selecciona una Umamusume --</option>';
                
                if (datos.umas) {
                    datos.umas.sort((a, b) => a.nombre.localeCompare(b.nombre));
                    datos.umas.forEach(uma => {
                        const opt = document.createElement('option');
                        opt.value = uma.id;
                        opt.textContent = `${uma.nombre} (ID: ${uma.id})`;
                        selectUma.appendChild(opt);
                    });
                }

                llenarMenu('racetrack', datos.racetracks);
                llenarMenu('terrain', datos.terrains);
                llenarMenu('direction', datos.directions);
                llenarMenu('length_type', datos.length_types);
                
                // Guardamos todas las distancias en memoria para filtrarlas luego
                if (datos.lengths) {
                    todasLasDistancias = datos.lengths.sort((a, b) => a - b);
                    filtrarDistanciasPorTipo(); // Disparamos el filtro inicial
                }

            } catch (error) {
                console.error("Error al cargar opciones:", error);
            }
        });

        // 2. LÓGICA PARA FILTRAR METROS SEGÚN EL TIPO DE DISTANCIA
        const filtrarDistanciasPorTipo = () => {
            const tipoSeleccionado = document.getElementById('length_type').value;
            const selectDistancia = document.getElementById('length');
            selectDistancia.innerHTML = '';

            let distanciasFiltradas = [];

            todasLasDistancias.forEach(metros => {
                if (tipoSeleccionado === 'Sprint' && metros < 1400) {
                    distanciasFiltradas.push(metros);
                } else if (tipoSeleccionado === 'Mile' && metros >= 1400 && metros <= 1800) {
                    distanciasFiltradas.push(metros);
                } else if (tipoSeleccionado === 'Medium' && metros > 1800 && metros <= 2400) {
                    distanciasFiltradas.push(metros);
                } else if (tipoSeleccionado === 'Long' && metros > 2400) {
                    distanciasFiltradas.push(metros);
                }
            });

            // Si el filtro encuentra valores del CSV, los pone; si no, muestra todos por seguridad
            const listaUsar = distanciasFiltradas.length > 0 ? distanciasFiltradas : todasLasDistancias;

            listaUsar.forEach(metros => {
                const opt = document.createElement('option');
                opt.value = metros;
                opt.textContent = `${metros} metros`;
                selectDistancia.appendChild(opt);
            });
        };

        // Escuchar cambios en el selector "Tipo de Distancia"
        document.getElementById('length_type').addEventListener('change', filtrarDistanciasPorTipo);

        // 3. LÓGICA DE CALCULO AL ENVIAR FORMULARIO
        document.getElementById('formulario-herencia').addEventListener('submit', async (e) => {
            e.preventDefault(); 

            const payload = {
                uma_id: document.getElementById('uma_id').value,
                racetrack: document.getElementById('racetrack').value,
                terrain: document.getElementById('terrain').value,
                direction: document.getElementById('direction').value,
                length_type: document.getElementById('length_type').value,
                length: document.getElementById('length').value,
                estrategia: document.getElementById('estrategia').value
            };

            const boton = e.target.querySelector('button');
            const textoOriginal = boton.textContent;
            boton.textContent = "Procesando afinidad genética...";
            boton.disabled = true;

            try {
                const respuesta = await fetch('/calcular', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const resultadoJson = await respuesta.json();
                
                const seccionResultados = document.getElementById('seccion-resultados');
                const contenedorTarjetas = document.getElementById('contenedor-tarjetas');
                
                seccionResultados.style.display = 'block';
                contenedorTarjetas.innerHTML = ''; 
                
                if (resultadoJson.resultados && resultadoJson.resultados.length > 0) {
                    
                    // A) GENERAR LAS TARJETAS HTML CON DISEÑO DE PODIO
                    resultadoJson.resultados.slice(0, 10).forEach((padre, idx) => {
                        let etiquetasHTML = '';
                        if (padre.rasgos) {
                            for (const [id_rasgo, estrellas] of Object.entries(padre.rasgos)) {
                                const nombreRasgo = resultadoJson.factores_maestro ? resultadoJson.factores_maestro[id_rasgo] : `Rasgo ${id_rasgo}`;
                                let colorFondo = 'bg-secondary';
                                const idNumerico = parseInt(id_rasgo);
                                if (idNumerico >= 10 && idNumerico <= 50) colorFondo = 'bg-primary'; 
                                else if (idNumerico >= 110) colorFondo = 'bg-danger'; 

                                const textoEstrellas = '★'.repeat(estrellas);
                                etiquetasHTML += `<span class="badge ${colorFondo} text-light me-1 px-2 py-1 mb-1" style="font-weight: 500;">${nombreRasgo} ${textoEstrellas}</span>`;
                            }
                        }

                        // Determinar estilo según la posición
                        let claseCard = 'card-normal';
                        let iconoPodio = '';
                        if (idx === 0) {
                            claseCard = 'card-top-1';
                            iconoPodio = '🏆 <span style="color: #ffd700; font-size: 0.9em;">#1 Óptimo</span> - ';
                        } else if (idx === 1) {
                            claseCard = 'card-top-2';
                            iconoPodio = '🥈 <span style="color: #c0c0c0; font-size: 0.9em;">#2</span> - ';
                        } else if (idx === 2) {
                            claseCard = 'card-top-3';
                            iconoPodio = '🥉 <span style="color: #cd7f32; font-size: 0.9em;">#3</span> - ';
                        }

                        const tarjetaHTML = `
                        <div class="card text-light mb-3 ${claseCard}" style="border-radius: 10px;">
                            <div class="card-body p-3">
                                <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-2" style="border-color: #2a2e37 !important;">
                                    <h6 class="card-title mb-0">${iconoPodio}<strong>Uma ID: ${padre.id}</strong></h6>
                                    <span class="fs-6" style="color: #34e89e;"><strong>Puntaje: ${Math.round(padre.puntaje)}</strong></span>
                                </div>
                                <div class="row">
                                    <div class="col-md-12">
                                        <div class="d-flex flex-wrap gap-1 mt-1">
                                            ${etiquetasHTML || '<span class="text-muted small">Sin datos de rasgos</span>'}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                        contenedorTarjetas.innerHTML += tarjetaHTML;
                    });

                    // B) GENERAR EL GRAFO DE RED DESCENTRALIZADA (Intacto de tu versión funcional)
                    const nodosArray = [];
                    const aristasArray = [];
                    const rasgosAgregados = new Set(); 
                    
                    const topPadres = resultadoJson.resultados.slice(0, 10); 

                    topPadres.forEach((padre) => {
                        const idNodoPadre = `padre_${padre.id}`;
                        
                        nodosArray.push({ 
                            id: idNodoPadre, 
                            label: `Uma:\n${padre.id}`, 
                            shape: 'dot',
                            size: 14,
                            color: { background: '#3498db', border: '#2980b9' },
                            font: { color: '#e0e0e0', size: 11 }
                        });

                        if (padre.rasgos && resultadoJson.prioridades_calculadas) {
                            for (const [id_rasgo, estrellas] of Object.entries(padre.rasgos)) {
                                if (resultadoJson.prioridades_calculadas[id_rasgo]) {
                                    
                                    const nombreRasgo = resultadoJson.factores_maestro[id_rasgo] || id_rasgo;
                                    const idNodoRasgo = `rasgo_${id_rasgo}`;

                                    if (!rasgosAgregados.has(idNodoRasgo)) {
                                        nodosArray.push({
                                            id: idNodoRasgo,
                                            label: nombreRasgo,
                                            shape: 'dot',
                                            size: 22,
                                            color: { background: '#ff4d94', border: '#ff1a75' },
                                            font: { color: '#ffb3d1', size: 14, bold: true }
                                        });
                                        rasgosAgregados.add(idNodoRasgo);
                                    }

                                    const pesoRequerido = resultadoJson.prioridades_calculadas[id_rasgo];
                                    const subtotal = estrellas * pesoRequerido;

                                    aristasArray.push({
                                        from: idNodoPadre,
                                        to: idNodoRasgo,
                                        label: `${subtotal}`, 
                                        value: subtotal, 
                                        font: { align: 'horizontal', color: '#8892b0', size: 11, strokeWidth: 0 },
                                        color: { color: '#444c5e', opacity: 0.65 } 
                                    });
                                }
                            }
                        }
                    });

                    const contenedorGrafo = document.getElementById('red-grafos');
                    const datosGrafo = { nodes: new vis.DataSet(nodosArray), edges: new vis.DataSet(aristasArray) };
                    
                    const opcionesGrafo = {
                        physics: {
                            enabled: true,
                            solver: 'forceAtlas2Based', 
                            forceAtlas2Based: {
                                gravitationalConstant: -55,
                                centralGravity: 0.01,
                                springLength: 140
                            }
                        },
                        edges: { 
                            smooth: false 
                        }
                    };
                    new vis.Network(contenedorGrafo, datosGrafo, opcionesGrafo);

                } else {
                    contenedorTarjetas.innerHTML = '<div class="alert alert-warning bg-dark border-warning text-warning">No se encontraron padres compatibles.</div>';
                }
            } catch (error) {
                console.error("Error al calcular:", error);
                alert("Error al procesar el cálculo. Revisa la consola.");
            } finally {
                boton.textContent = textoOriginal;
                boton.disabled = false;
            }
        });
    </script>
</body>
</html>
